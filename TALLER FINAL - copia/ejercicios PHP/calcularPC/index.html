<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

form {
    width: 420px;
    padding: 35px;

    background-color: #ffffff;
    border-radius: 15px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

    display: flex;
    flex-direction: column;
    gap: 12px;
}

form::before {
    content: "MONITOREO DEL SISTEMA";
    text-align: center;

    font-size: 24px;
    font-weight: bold;

    color: #243b55;

    margin-bottom: 15px;
}

label {
    font-size: 15px;
    font-weight: bold;
    color: #333;

    margin-top: 5px;
}

input[type="number"] {
    width: 100%;

    padding: 12px;

    font-size: 16px;

    border: 2px solid #ddd;
    border-radius: 8px;

    outline: none;

    transition: 0.3s;
}

input[type="number"]:focus {
    border-color: #007bff;

    box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
}

input[type="submit"] {
    margin-top: 15px;

    padding: 13px;

    border: none;
    border-radius: 8px;

    background-color: #007bff;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

input[type="submit"]:hover {
    background-color: #0056b3;

    transform: translateY(-2px);

    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
}

input[type="submit"]:active {
    transform: scale(0.98);
}



</style>
